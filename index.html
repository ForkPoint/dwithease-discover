<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discover · DWithEase</title>
    <meta name="description" content="Useful tools, technical deep-dives, and commerce updates from DWithEase and ForkPoint.">
    <link rel="canonical" href="https://discover.dwithease.com/">
    <link rel="alternate" type="application/json" title="DWithEase Discover Live Feed" href="feed-live.json">
    <link rel="alternate" type="application/rss+xml" title="DWithEase Discover RSS Feed" href="rss.xml">
    <link rel="alternate" type="application/atom+xml" title="DWithEase Discover Atom Feed" href="atom.xml">
    <meta name="theme-color" content="#f6f9fc">

    <!-- OpenGraph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DWithEase Discover">
    <meta property="og:title" content="Discover · Commerce News &amp; Tools by DWithEase">
    <meta property="og:description" content="Useful tools, technical deep-dives, and commerce updates from DWithEase and ForkPoint.">
    <meta property="og:url" content="https://discover.dwithease.com/">
    <meta property="og:image" content="https://discover.dwithease.com/assets/discover-fallback.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Discover · Commerce News &amp; Tools by DWithEase">
    <meta name="twitter:description" content="Useful tools, technical deep-dives, and commerce updates from DWithEase and ForkPoint.">
    <meta name="twitter:image" content="https://discover.dwithease.com/assets/discover-fallback.png">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/dwithease-logo.svg">
    <link rel="icon" href="assets/dwithease-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/discover.css">
    <script>
        try {
            const savedTheme = localStorage.getItem('dwithease_discover_theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        } catch { /* storage restricted */ }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
    <script type="module" src="assets/discover-page.js"></script>
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand-link" href="https://dwithease.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit DWithEase">
                <picture class="brand-logo-frame">
                    <source srcset="assets/dwithease-logo-on-dark.svg" media="(prefers-color-scheme: dark)">
                    <img src="assets/dwithease-logo.svg" alt="DWithEase" class="brand-logo">
                </picture>
            </a>
            <div class="site-header-actions">
                <div id="theme-switcher-mount" class="theme-switcher-mount"></div>
                <a class="site-link" href="https://dwithease.com/" target="_blank" rel="noopener noreferrer">Visit DWithEase</a>
            </div>
        </header>

        <main>
            <header class="page-header">
                <p class="eyebrow">DWithEase · By ForkPoint</p>
                <h1>Discover</h1>
                <p class="page-intro">Commerce news, technical articles, and useful tools for teams that build online stores.</p>
                <div class="feed-badge-row">
                    <a class="feed-badge-pill" href="feed-live.json" target="_blank" rel="noopener noreferrer" title="Live JSON Feed">
                        <span class="pulse-indicator"></span> Live JSON Feed
                    </a>
                    <a class="feed-badge-pill secondary" href="rss.xml" target="_blank" rel="noopener noreferrer" title="RSS 2.0 Feed">
                        RSS Feed
                    </a>
                    <a class="feed-badge-pill secondary" href="schema.html" title="Feed Reference &amp; API">
                        Feed Reference &amp; API
                    </a>
                    <button type="button" class="feed-badge-pill secondary subscribe-modal-trigger" id="subscribe-feed-btn" title="Subscribe in your feed reader">
                        📡 Reader Apps
                    </button>
                </div>
            </header>

            <div id="discover-content" class="discover-content">
                <div class="loading-grid" aria-label="Loading Discover" aria-live="polite">
                    <div class="loading-card"></div>
                    <div class="loading-card"></div>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <span>Discover by DWithEase</span>
            <nav class="footer-links" aria-label="Footer links">
                <a href="feed-live.json" target="_blank" rel="noopener noreferrer">Live JSON feed</a>
                <a href="rss.xml" target="_blank" rel="noopener noreferrer">RSS feed</a>
                <a href="atom.xml" target="_blank" rel="noopener noreferrer">Atom feed</a>
                <a href="schema.html">Feed reference</a>
                <button type="button" class="shortcuts-footer-btn" id="shortcuts-btn" title="Keyboard shortcuts (Press ?)">Shortcuts (?)</button>
                <a href="https://dwithease.com/" target="_blank" rel="noopener noreferrer">dwithease.com</a>
            </nav>
        </footer>
    </div>
</body>
</html>
