name: Publish queued feed items

# Releases one curated item from feed-dev.json to feed-live.json on Monday,
# Wednesday, and Friday. That matches the roughly 3 SFCC articles the sources
# produce each week, so extension users get a steady trickle and the queue lasts.
on:
  schedule:
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: publish-feed
  cancel-in-progress: false

env:
  # Override with the FEED_PUBLISH_LIMIT repository variable.
  PUBLISH_LIMIT: ${{ vars.FEED_PUBLISH_LIMIT || '1' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Publish the next batch and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the batch from the newest main on each attempt, so a push that lands
          # during the run cannot drop or duplicate items.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run promote:feed -- --limit "$PUBLISH_LIMIT"

            if git diff --quiet -- feed-live.json; then
              echo "Publish queue is empty."
              exit 0
            fi

            git add feed-live.json rss.xml atom.xml
            git commit -m "data: publish queued feed items"
            if git push origin HEAD:main; then
              # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
              gh workflow run pages.yml --ref main
              exit 0
            fi
            echo "Push attempt $attempt failed. Retrying from the newest main."
          done
          exit 1

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Automation failed: ${{ github.workflow }}'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Keep one open issue per workflow and comment on repeat failures.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Run: $RUN_URL"
          fi
