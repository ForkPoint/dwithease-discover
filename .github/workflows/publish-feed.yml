name: Publish queued feed items

# Releases a small batch of curated items from feed-dev.json to feed-live.json
# each weekday, so extension users get a steady trickle instead of a burst.
on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-feed
  cancel-in-progress: false

env:
  # Override with the FEED_PUBLISH_LIMIT repository variable.
  PUBLISH_LIMIT: ${{ vars.FEED_PUBLISH_LIMIT || '2' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Publish the next batch
        run: npm run promote:feed -- --limit "$PUBLISH_LIMIT"

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- feed-live.json; then
            echo "Publish queue is empty."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed-live.json rss.xml atom.xml
          git commit -m "data: publish queued feed items"
          git push origin HEAD:main

          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
          gh workflow run pages.yml --ref main
