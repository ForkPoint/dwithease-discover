name: Harvest RSS sources

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harvest-rss-sources
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Continue the candidate branch
        run: |
          branch="automation/rss-sources"
          git fetch origin main
          if git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"; then
            git switch -C "$branch" "origin/$branch"
            git rebase origin/main
          else
            git switch -c "$branch" origin/main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Harvest RSS sources
        run: npm run harvest:rss-sources

      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- harvested-candidates.json; then
            echo "No new RSS candidate articles."
            exit 0
          fi

          branch="automation/rss-sources"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvested-candidates.json
          git commit -m "data: harvest RSS sources"
          git push --force-with-lease origin "$branch"

          if [ "$(gh pr list --state open --head "$branch" --json number --jq 'length')" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "data: harvest RSS sources" \
              --body "Adds newly harvested RSS/Atom articles to harvested-candidates.json for curation review. This does not change the Discover feed. Curate each candidate using npm run curate."
          fi
