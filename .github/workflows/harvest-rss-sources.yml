name: Harvest RSS sources

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: harvest-rss-sources
  cancel-in-progress: false

env:
  BRANCH: automation/rss-sources

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Queue trusted releases on main
        id: trusted
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Official PWA Kit releases skip review and go straight to the publish queue.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git switch -C main origin/main
            npm run harvest:rss-sources -- --trusted-only
            if git diff --quiet -- feed-dev.json; then
              exit 0
            fi
            npm run validate:feed -- feed-dev.json
            git add feed-dev.json
            git commit -m "data: queue PWA Kit releases"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed. Retrying from the newest main."
          done
          exit 1

      - name: Rebuild the candidate branch from main
        run: |
          # Rebasing an old bot commit conflicts after curation changes main,
          # so start from main and carry the unmerged file over instead.
          git fetch origin main
          git switch -C "$BRANCH" origin/main
          if git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            git show "origin/$BRANCH:harvested-candidates.json" > "$RUNNER_TEMP/previous.json"
          fi


      - name: Harvest
        id: harvest
        continue-on-error: true
        run: npm run harvest:rss-sources -- --previous "$RUNNER_TEMP/previous.json"

      # PRs opened with GITHUB_TOKEN do not run PR checks, so check the data here.
      - name: Check the harvested data
        run: npm run validate:candidates -- harvested-candidates.json

      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/main -- harvested-candidates.json; then
            echo "No new RSS candidate articles."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvested-candidates.json
          git commit -m "data: harvest RSS sources"
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "data: harvest RSS sources" \
              --body "Adds newly harvested RSS/Atom articles to harvested-candidates.json for curation review. This does not change the Discover feed. Curate each candidate using npm run curate."
          fi

      - name: Fail when a source failed
        if: steps.trusted.outcome == 'failure' || steps.harvest.outcome == 'failure'
        run: |
          echo "A harvest step failed. See its log above."
          exit 1

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Automation failed: ${{ github.workflow }}'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Keep one open issue per workflow and comment on repeat failures.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Run: $RUN_URL"
          fi
