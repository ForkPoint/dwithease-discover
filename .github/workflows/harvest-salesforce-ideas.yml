name: Harvest Salesforce Commerce ideas

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: harvest-salesforce-ideas
  cancel-in-progress: false

env:
  BRANCH: automation/salesforce-commerce-ideas

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild the candidate branch from main
        run: |
          # Rebasing an old bot commit conflicts after curation changes main,
          # so start from main and carry the unmerged file over instead.
          git switch -C "$BRANCH" origin/main
          if git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            git show "origin/$BRANCH:salesforce-ideas.json" > "$RUNNER_TEMP/previous.json"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Install browser
        run: npx playwright-core install --with-deps chromium

      - name: Harvest
        id: harvest
        continue-on-error: true
        run: npm run harvest:salesforce-ideas -- --previous "$RUNNER_TEMP/previous.json"

      # PRs opened with GITHUB_TOKEN do not run PR checks, so check the data here.
      - name: Check the harvested data
        run: npm run validate:candidates -- salesforce-ideas.json

      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/main -- salesforce-ideas.json; then
            echo "No new Commerce ideas."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesforce-ideas.json
          git commit -m "data: harvest Salesforce Commerce ideas"
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "data: harvest Salesforce Commerce ideas" \
              --body "Adds newly delivered Commerce ideas from Salesforce IdeaExchange to the review catalog. This does not change the Discover feed. Pick each feed item in a separate PR."
          fi

      - name: Fail when a source failed
        if: steps.harvest.outcome == 'failure'
        run: |
          echo "The harvest step failed. See its log above."
          exit 1

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Automation failed: ${{ github.workflow }}'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Keep one open issue per workflow and comment on repeat failures.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Run: $RUN_URL"
          fi
