name: Deploy Discover site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install test packages
        run: npm ci

      - name: Generate schema references
        run: |
          npm run write:schema
          npm run write:openapi

      - name: Test feed and page code
        run: npm test

      - name: Validate public feeds
        run: npm run validate:feed -- feed-live.json feed-dev.json

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html schema.html openapi.json feed.schema.json CNAME .nojekyll feed-live.json feed-dev.json _site/
          cp -R assets _site/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
