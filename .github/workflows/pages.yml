name: Validate and deploy Discover site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install test packages
        run: npm ci

      - name: Generate schema references
        run: |
          npm run write:schema
          npm run write:openapi
          npm run write:syndication

      - name: Test feed and page code
        run: npm test

      - name: Type-check schema code
        run: npm run typecheck

      - name: Validate public feeds
        run: npm run validate:feed -- feed-live.json feed-dev.json

      - name: Validate public source registry
        run: npm run validate:sources

      - name: Validate harvested candidates
        run: npm run validate:candidates -- harvested-candidates.json salesforce-ideas.json

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html schema.html openapi.json feed.schema.json sources.json CNAME .nojekyll feed-live.json feed-dev.json rss.xml atom.xml manifest.webmanifest sw.js _site/
          cp -R assets _site/assets

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: validate
    # Pages rejects overlapping deployments, so queue push and dispatch deploys together.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Automation failed: ${{ github.workflow }}'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Keep one open issue per workflow and comment on repeat failures.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Run: $RUN_URL"
          fi
